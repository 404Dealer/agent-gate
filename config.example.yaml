telegram:
  botToken: "${NIGHTDROP_BOT_TOKEN}"
  allowedUsers: [123456789]  # Your Telegram user ID(s)

watch:
  directory: "./drafts/inbox"
  pollIntervalMs: 2000

# Approval preview policy. By default, long/truncated bodies cannot be approved
# from Telegram until you provide a full-review path or opt in explicitly.
approval:
  bodyPreviewChars: 2000
  allowTruncatedApproval: false

# Set true in production after applying docs/deployment.md permissions.
security:
  enforceProductionPermissions: false

providers:
  # Simplest self-hosted Gmail path: create a dedicated Google App Password,
  # store it under the nightdrop pass namespace, and use authenticated SMTP over implicit TLS.
  gmail-smtp:
    type: "email-smtp"
    host: "smtp.gmail.com"
    port: 465
    tlsMode: "implicit"
    username: "you@gmail.com"
    password: "${NIGHTDROP_GMAIL_APP_PASSWORD}"
    fromAddress: "you@gmail.com"
    displayName: "Your Name"

  # Narrower gmail.send OAuth alternative; setup is more involved.
  gmail:
    type: "email-gmail"
    clientId: "${NIGHTDROP_GOOGLE_CLIENT_ID}"
    # Desktop/public-client onboarding does not use a clientSecret.
    refreshToken: "${NIGHTDROP_GOOGLE_REFRESH_TOKEN}"
    fromAddress: "you@gmail.com"
    displayName: "Your Name"

  outlook:
    type: "email-outlook"
    clientId: "${NIGHTDROP_MICROSOFT_CLIENT_ID}"
    # Omit clientSecret for recommended public-client PKCE/device flows.
    # clientSecret: "${NIGHTDROP_MICROSOFT_CLIENT_SECRET}"
    refreshToken: "${NIGHTDROP_MICROSOFT_REFRESH_TOKEN}"
    # Recommended for durable Microsoft token rotation. This key is accepted only
    # when refreshToken is the exact matching
    # ${PASS:nightdrop/microsoft-refresh-token-<transaction>} reference.
    # Legacy env-based configs may omit it and rotate only in memory until restart.
    # refreshTokenKey: "nightdrop/microsoft-refresh-token-<transaction>"
    tenantId: "common"
    fromAddress: "you@outlook.com"
    displayName: "Your Name"
    # Required only when this provider is attached to mailboxProfiles.
    # The refresh token must have delegated Mail.ReadWrite as well as Mail.Send.
    mailboxAccess: true

  zoho:
    type: "email-zoho"
    clientId: "${NIGHTDROP_ZOHO_CLIENT_ID}"
    clientSecret: "${NIGHTDROP_ZOHO_CLIENT_SECRET}"
    refreshToken: "${NIGHTDROP_ZOHO_REFRESH_TOKEN}"
    region: "us" # us|eu|in|au|jp|ca|sa
    accountId: "${NIGHTDROP_ZOHO_ACCOUNT_ID}"
    fromAddress: "you@yourdomain.com"

  log:
    type: "log-only"

# Optional bounded Inbox profiles. Each profile selects exactly one provider.
# Add more entries/providers for additional Gmail or Outlook accounts.
mailboxProfiles:
  personal:
    provider: "gmail-smtp"
  work:
    provider: "outlook"

defaults:
  provider: "log"
  timezone: "UTC"
  autoDeleteAfterDays: 30

audit:
  enabled: true
  logFile: "./audit.log"
