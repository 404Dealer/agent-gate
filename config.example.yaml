telegram:
  botToken: "${AGENT_GATE_BOT_TOKEN}"
  allowedUsers: [123456789]  # Your Telegram user ID(s)

watch:
  directory: "./drafts/inbox"
  pollIntervalMs: 2000

# Approval preview policy. By default, long/truncated bodies cannot be approved
# from Telegram until you provide a full-review path or opt in explicitly.
approval:
  bodyPreviewChars: 2000
  allowTruncatedApproval: false

# Set true in production after applying docs/deployment.md permissions.
security:
  enforceProductionPermissions: false

providers:
  zoho:
    type: "email-zoho"
    clientId: "${ZOHO_CLIENT_ID}"
    clientSecret: "${ZOHO_CLIENT_SECRET}"
    refreshToken: "${ZOHO_REFRESH_TOKEN}"
    accountId: "${ZOHO_ACCOUNT_ID}"
    fromAddress: "you@yourdomain.com"

  log:
    type: "log-only"

defaults:
  provider: "log"
  timezone: "UTC"
  autoDeleteAfterDays: 30

audit:
  enabled: true
  logFile: "./audit.log"
